[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Cancun deploys on Hedera testnet (chain 296); AMW shipped the same setting.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
